# Local MariaDB for development and the preview (database beratungstools) and the integration
# tests (beratungstools_test, emptied by every test file): npm run db:up.
# `docker compose --profile app up --build` also runs the add-on image against it.
services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: beratungstools
      MARIADB_USER: beratungstools
      MARIADB_PASSWORD: beratungstools
    ports:
      - '3307:3306'
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 2s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ./dev/mariadb-init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  addon:
    profiles: [app]
    build: .
    environment:
      DATABASE_URL: mariadb://beratungstools:beratungstools@mariadb:3306/beratungstools
      ADDONSERVICE_URL: http://addonservice:8090
    ports:
      - '8080:8080'
    depends_on:
      mariadb:
        condition: service_healthy
