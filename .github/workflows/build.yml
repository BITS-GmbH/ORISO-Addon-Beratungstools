name: test, build and push image to harbor

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: beratungstools
          MARIADB_USER: beratungstools
          MARIADB_PASSWORD: beratungstools
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: mariadb://beratungstools:beratungstools@127.0.0.1:3307/beratungstools
      - run: npm run build

  build-and-push:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: [generic, on-prem]
    steps:
      - name: Login to Harbor
        run: echo "${{ secrets.HARBOR_SECRET }}" | docker login https://harbor.mybits.dev -u '${{ secrets.HARBOR_USER }}' --password-stdin
      - uses: actions/checkout@v6
      - name: Set image tag
        id: vars
        run: echo "tag=0.1.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: harbor.mybits.dev/digisucht/addon-beratungstools:${{ steps.vars.outputs.tag }}
